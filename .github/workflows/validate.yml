name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  json:
    name: Validasi JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validasi file JSON
        run: |
          for f in config/bridge-servers.example.json config/mcp.json; do
            echo "Memeriksa $f"
            python3 -m json.tool "$f" > /dev/null
          done

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Jalankan ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
